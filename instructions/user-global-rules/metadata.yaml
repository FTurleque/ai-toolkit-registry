name: user-global-rules
displayName: Règles personnelles transverses
description: >-
  Règles à poser dans ~/.claude/rules/ pour qu'elles s'appliquent à tous les projets : langue des
  réponses, et interdiction de créer fichiers, dossiers ou worktrees hors du dépôt de travail. Une
  règle par fichier, à prendre ou à laisser séparément.
